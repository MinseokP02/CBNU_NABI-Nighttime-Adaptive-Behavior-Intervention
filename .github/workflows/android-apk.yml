name: Android demo APK

on:
  push:
    branches: [main, feature/android-app]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/nabi-demo-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nabi-demo-apk
          path: android/out/*.apk
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          generate_release_notes: true
